<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiku ❤️ Sangita | Moon Journey</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#02030b;
  color:white;
}

/* SPACE */
.space{
  width:100vw;
  height:78vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 70% 20%,#24285c 0%,#0b0e2b 38%,#02030b 85%);
}

/* STARS */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 8px white;
  animation:blink 1.8s infinite alternate;
}

@keyframes blink{
  to{
    opacity:.15;
    transform:scale(1.7);
  }
}

/* MOON */
.moon{
  position:absolute;
  width:210px;
  height:210px;
  right:7%;
  top:9%;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,#fff,#d7d9df 55%,#9295a4);
  box-shadow:
    0 0 35px #fff,
    0 0 100px rgba(190,205,255,.5);
}

.crater{
  position:absolute;
  border-radius:50%;
  background:#a5a7b0;
  opacity:.45;
}

.c1{
  width:38px;
  height:25px;
  left:35px;
  top:55px;
}

.c2{
  width:25px;
  height:25px;
  right:42px;
  top:95px;
}

.c3{
  width:45px;
  height:30px;
  left:80px;
  bottom:35px;
}

/* MOON GROUND */
.ground{
  position:absolute;
  left:-10%;
  bottom:-18%;
  width:120%;
  height:45%;
  border-radius:50% 50% 0 0;
  background:
    radial-gradient(circle,#999 2px,transparent 3px),
    linear-gradient(#777887,#353545);
  background-size:55px 38px,100% 100%;
  box-shadow:0 -10px 35px rgba(255,255,255,.15);
}

/* EARTH */
.earth{
  position:absolute;
  width:190px;
  height:190px;
  left:-60px;
  bottom:-100px;
  border-radius:50%;
  background:linear-gradient(135deg,#42baff,#14529a,#07142f);
  box-shadow:0 0 35px #197ad0;
}

/* SPACESHIP */
.spaceship{
  position:absolute;
  left:7%;
  top:45%;
  width:180px;
  height:90px;
  z-index:10;
  transition:all 3s ease;
}

.ship-body{
  position:absolute;
  width:155px;
  height:65px;
  left:10px;
  top:10px;
  border-radius:60% 60% 45% 45%;
  background:linear-gradient(145deg,#f4f7ff,#8e99ae 55%,#343b51);
  border:3px solid #bdefff;
  box-shadow:
    0 0 20px #72dcff,
    inset 0 -12px 15px rgba(0,0,0,.35);
}

.window{
  position:absolute;
  width:55px;
  height:32px;
  left:50px;
  top:17px;
  border-radius:50%;
  background:radial-gradient(circle,#80eaff,#172c62);
  border:3px solid #d9ffff;
  box-shadow:0 0 15px #55ddff;
}

.leg{
  position:absolute;
  width:12px;
  height:35px;
  background:#6d7485;
  bottom:-18px;
}

.l1{left:35px}
.l2{right:35px}

.fire{
  position:absolute;
  width:35px;
  height:18px;
  left:-28px;
  top:35px;
  border-radius:50%;
  background:linear-gradient(90deg,#ff3d00,#ffd000,transparent);
  filter:blur(2px);
  animation:fire .25s infinite alternate;
}

@keyframes fire{
  to{width:48px}
}

/* CHARACTERS */
.characters{
  position:absolute;
  z-index:15;
  left:49%;
  bottom:20%;
  display:none;
  align-items:flex-end;
  gap:35px;
  transform:translateX(-50%);
}

.character{
  position:relative;
  width:75px;
  height:170px;
}

/* HEAD */
.head{
  position:absolute;
  width:52px;
  height:58px;
  left:12px;
  top:0;
  border-radius:48% 48% 45% 45%;
  background:linear-gradient(145deg,#f1bd96,#bd7654);
  box-shadow:inset -7px -4px 10px rgba(70,30,20,.18);
}

/* HAIR */
.hair{
  position:absolute;
  width:60px;
  height:38px;
  left:8px;
  top:-5px;
  border-radius:55% 55% 25% 20%;
  background:#17131a;
  z-index:2;
}

.girl .hair{
  height:55px;
  border-radius:50% 50% 30% 30%;
}

/* FACE */
.eye{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#17131a;
  top:27px;
  z-index:4;
}

.eye.left{left:25px}
.eye.right{left:45px}

.mouth{
  position:absolute;
  width:15px;
  height:7px;
  border-bottom:2px solid #7d3838;
  border-radius:50%;
  left:30px;
  top:42px;
  z-index:4;
}

/* BODY */
.body{
  position:absolute;
  width:66px;
  height:82px;
  left:5px;
  top:62px;
  border-radius:25px 25px 12px 12px;
  background:linear-gradient(135deg,#2d79dc,#173e82);
  box-shadow:inset -8px -8px 12px rgba(0,0,0,.25);
}

.girl .body{
  background:linear-gradient(135deg,#d95d9e,#722b67);
}

/* ARMS */
.arm{
  position:absolute;
  width:14px;
  height:65px;
  top:70px;
  background:#dca17b;
  border-radius:12px;
  z-index:-1;
}

.arm.left{
  left:-7px;
  transform:rotate(18deg);
}

.arm.right{
  right:-7px;
  transform:rotate(-18deg);
}

/* LEGS */
.leg-person{
  position:absolute;
  width:20px;
  height:60px;
  top:138px;
  background:#20253a;
  border-radius:12px;
}

.leg-person.left{left:17px}
.leg-person.right{right:17px}

/* SITTING */
.characters.sitting{
  bottom:16%;
}

.characters.sitting .character{
  height:120px;
}

.characters.sitting .body{
  top:62px;
  height:55px;
  transform:skew(-8deg);
}

.characters.sitting .leg-person{
  top:105px;
  height:35px;
  width:48px;
}

.characters.sitting .leg-person.left{
  left:0;
  transform:rotate(12deg);
}

.characters.sitting .leg-person.right{
  right:-10px;
  transform:rotate(-12deg);
}

/* HEART */
.heart{
  font-size:25px;
  animation:heart 1s infinite;
}

@keyframes heart{
  50%{transform:scale(1.3)}
}

/* MESSAGE */
.message{
  position:absolute;
  z-index:30;
  width:100%;
  bottom:6%;
  text-align:center;
  font-size:19px;
  font-weight:bold;
  text-shadow:0 0 15px #ff9ad9;
}

/* BUTTON AREA */
.controls{
  height:22vh;
  min-height:150px;
  background:#08091b;
  padding:12px;
  text-align:center;
}

.title{
  font-size:21px;
  margin-bottom:8px;
}

button{
  border:1px solid #8eeaff;
  background:linear-gradient(135deg,#1b2458,#632d72);
  color:white;
  padding:11px 13px;
  margin:4px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 10px rgba(80,210,255,.25);
}

button:active{
  transform:scale(.94);
}

#status{
  color:#ffd5ee;
  font-size:14px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="space">

  <!-- STARS -->
  <div class="star" style="left:5%;top:15%"></div>
  <div class="star" style="left:12%;top:35%"></div>
  <div class="star" style="left:20%;top:10%"></div>
  <div class="star" style="left:28%;top:27%"></div>
  <div class="star" style="left:37%;top:12%"></div>
  <div class="star" style="left:45%;top:31%"></div>
  <div class="star" style="left:53%;top:8%"></div>
  <div class="star" style="left:62%;top:25%"></div>
  <div class="star" style="left:72%;top:37%"></div>
  <div class="star" style="left:83%;top:28%"></div>
  <div class="star" style="left:92%;top:12%"></div>
  <div class="star" style="left:88%;top:50%"></div>

  <!-- MOON -->
  <div class="moon">
    <div class="crater c1"></div>
    <div class="crater c2"></div>
    <div class="crater c3"></div>
  </div>

  <div class="earth"></div>
  <div class="ground"></div>

  <!-- SPACESHIP -->
  <div class="spaceship" id="ship">
    <div class="fire"></div>
    <div class="ship-body">
      <div class="window"></div>
    </div>
    <div class="leg l1"></div>
    <div class="leg l2"></div>
  </div>

  <!-- CHARACTERS -->
  <div class="characters" id="characters">

    <!-- CHIKU -->
    <div class="character boy">

      <div class="hair"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="body"></div>

      <div class="leg-person left"></div>
      <div class="leg-person right"></div>

    </div>

    <div class="heart">❤️</div>

    <!-- SANGITA -->
    <div class="character girl">

      <div class="hair"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="body"></div>

      <div class="leg-person left"></div>
      <div class="leg-person right"></div>

    </div>

  </div>

  <div class="message" id="message"></div>

</div>


<div class="controls">

  <div class="title">
    🚀 Chiku ❤️ Sangita — Our Moon Journey 🌙
  </div>

  <button onclick="launch()">🚀 Spaceship Launch</button>
  <button onclick="land()">🌙 Chand Par Land</button>
  <button onclick="exitShip()">🚪 Bahar Aao</button>
  <button onclick="walk()">🚶 Chand Par Chalo</button>
  <button onclick="sit()">❤️ Saath Baitho</button>
  <button onclick="watchStars()">✨ Tare Dekho</button>
  <button onclick="restart()">🔄 Restart</button>

  <div id="status">
    Pehle 🚀 Spaceship Launch dabao ❤️
  </div>

</div>


<script>

const ship = document.getElementById("ship");
const characters = document.getElementById("characters");
const message = document.getElementById("message");
const status = document.getElementById("status");

function launch(){

  ship.style.left="43%";
  ship.style.top="18%";
  ship.style.transform="rotate(-12deg)";

  characters.style.display="none";

  message.innerHTML="🚀 Chiku aur Sangita Chand ki taraf ja rahe hain...";

  status.innerHTML="Spaceship space mein travel kar raha hai ❤️";
}


function land(){

  ship.style.left="67%";
  ship.style.top="47%";
  ship.style.transform="scale(.8)";

  message.innerHTML="🌙 Chand nazar aa gaya...";

  status.innerHTML="🚀 Spaceship Chand par safely land ho gaya!";
}


function exitShip(){

  ship.style.left="82%";
  ship.style.top="46%";
  ship.style.transform="scale(.65)";

  characters.style.display="flex";
  characters.classList.remove("sitting");

  message.innerHTML="❤️ Chiku aur Sangita Chand par utar gaye";

  status.innerHTML="🚪 Dono spaceship se bahar aa gaye!";
}


function walk(){

  characters.style.display="flex";
  characters.classList.remove("sitting");

  characters.style.left="58%";
  characters.style.bottom="19%";

  message.innerHTML="🚶 Dono Chand ki surface par saath chal rahe hain...";

  status.innerHTML="Chiku aur Sangita Chand par walk kar rahe hain 🌙";
}


function sit(){

  characters.style.display="flex";
  characters.classList.add("sitting");

  characters.style.left="50%";
  characters.style.bottom="14%";

  message.innerHTML=
  "❤️ Chiku & Sangita<br>Chand par saath baithkar 🌙";

  status.innerHTML="Dono Chand par saath baith gaye ❤️";
}


function watchStars(){

  characters.style.display="flex";
  characters.classList.add("sitting");

  characters.style.left="50%";
  characters.style.bottom="14%";

  document.querySelectorAll(".star").forEach(star=>{
    star.style.animationDuration=".5s";
    star.style.boxShadow=
      "0 0 10px white,0 0 22px #9fc8ff";
  });

  message.innerHTML=
  "✨ Laakhon taaron ke beech...<br>"+
  "Chiku ❤️ Sangita — ek khoobsurat raat 🌙";

  status.innerHTML=
  "Dono ek saath baithkar Chand aur taaron ko dekh rahe hain ✨❤️";
}


function restart(){

  ship.style.left="7%";
  ship.style.top="45%";
  ship.style.transform="none";

  characters.style.display="none";
  characters.classList.remove("sitting");

  message.innerHTML="";

  document.querySelectorAll(".star").forEach(star=>{
    star.style.animationDuration="1.8s";
    star.style.boxShadow="0 0 8px white";
  });

  status.innerHTML=
  "Pehle 🚀 Spaceship Launch dabao ❤️";
}

</script>

</body>
</html>
